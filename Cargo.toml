[package]
name = "agent-repertoire"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "rep"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.13"
toml_edit = "0.25"
jsonschema = "0.57"
thiserror = "2"
terminal_size = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "3.4.0", features = ["local", "server", "transport-io"] }
tokio = { version = "1.53.1", features = ["full"] }
schemars = { version = "1.2.2", default-features = false, features = ["derive", "std"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
